name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-ci:
    name: Backend API (Java 21 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finance_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test Backend API
        run: |
          cd api
          mvn clean test compile -Dspring.datasource.url=jdbc:postgresql://localhost:5432/finance_db -Dspring.datasource.username=postgres -Dspring.datasource.password=admin

  frontend-ci:
    name: Frontend Dashboard (React 19 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: |
          cd ui
          npm ci

      - name: Test Frontend Authentication
        working-directory: ui
        run: npm test

      - name: Build Frontend Application
        run: |
          cd ui
          npm run build
