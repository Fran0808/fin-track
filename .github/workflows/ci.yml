name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  docker-ci:
    name: Docker Backend Image
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-only-unused-password
      JWT_SECRET: ci-only-unused-signing-key-at-least-32-bytes
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --profile tools config --quiet

      - name: Build backend image
        run: docker compose build api

  backend-ci:
    name: Backend API (Java 21 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finance_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test Backend API
        working-directory: api
        run: mvn clean test compile -Dspring.datasource.url=jdbc:postgresql://localhost:5432/finance_db -Dspring.datasource.username=postgres -Dspring.datasource.password=admin

  frontend-ci:
    name: Frontend Dashboard (React 19 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        working-directory: ui
        run: npm ci

      - name: Test Frontend Application
        working-directory: ui
        run: npm test

      - name: Build Frontend Application
        working-directory: ui
        run: npm run build

  android-ci:
    name: Android App (Kotlin / Jetpack Compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walletpulse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
