name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  scripts-ci:
    name: Windows developer scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test scripts with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\checks\test-scripts.ps1
      - name: Test scripts with PowerShell 7
        shell: pwsh
        run: .\scripts\checks\test-scripts.ps1

  docker-ci:
    name: Docker Backend Image
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-only-unused-password
      JWT_SECRET: ci-only-unused-signing-key-at-least-32-bytes
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --profile tools config --quiet

      - name: Build backend image
        run: docker compose build api

  backend-ci:
    name: Backend API (Java 21 / Maven)
    runs-on: ubuntu-latest
    env:
      APP_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/fintrack_app_eval_ci
      DEPLOYMENT_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/fintrack_deployment_eval_ci
      INSTRUMENT_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/fintrack_instruments_eval_ci
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      CLASSIFICATION_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/fintrack_classification_eval_ci
      CLASSIFICATION_TEST_DATABASE_USER: postgres
      CLASSIFICATION_TEST_DATABASE_PASSWORD: admin
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: admin

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fintrack_app_eval_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create disposable persistence test databases
        env:
          PGPASSWORD: admin
        run: |
          createdb -h localhost -U postgres fintrack_deployment_eval_ci
          createdb -h localhost -U postgres fintrack_instruments_eval_ci
          createdb -h localhost -U postgres fintrack_classification_eval_ci
          createdb -h localhost -U postgres fintrack_provenance_eval_ci
          createdb -h localhost -U postgres fintrack_capture_origin_eval_ci

      - name: Verify incremental capture origin migration
        env:
          PGPASSWORD: admin
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -d fintrack_capture_origin_eval_ci -f scripts/migrations/test_transaction_capture_origin.sql

      - name: Verify incremental ingestion provenance migration
        env:
          PGPASSWORD: admin
        run: psql -X -h localhost -U postgres -v ON_ERROR_STOP=1 -d fintrack_provenance_eval_ci -f scripts/migrations/test_ingestion_provenance.sql

      - name: Compile and Test Backend API
        working-directory: api
        run: mvn clean verify -Dmail.sync.enabled=false

  frontend-ci:
    name: Frontend Dashboard (React 19 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        working-directory: ui
        run: npm ci

      - name: Test Frontend Application
        working-directory: ui
        run: npm test

      - name: Build Frontend Application
        working-directory: ui
        run: npm run build

      - name: Lint Frontend Application
        working-directory: ui
        run: npm run lint

  android-ci:
    name: Android App (Kotlin / Jetpack Compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest testReleaseUnitTest

      - name: Assemble Android APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
