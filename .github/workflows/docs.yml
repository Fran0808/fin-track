name: Documentation references

on:
  push:
    branches: [main, master]
    paths:
      - '**.md'
      - '.env.example'
      - 'scripts/checks/test-docs.ps1'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.md'
      - '.env.example'
      - 'scripts/checks/test-docs.ps1'
      - '.github/workflows/docs.yml'

jobs:
  references:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation references
        shell: pwsh
        run: .\scripts\checks\test-docs.ps1
