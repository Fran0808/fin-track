# Server and Application Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=finance-listen-api
app.server.public-url=${APP_SERVER_PUBLIC_URL:http://192.168.1.5:8080}

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Levels
logging.level.com.store.api=DEBUG
logging.level.org.springframework.web=INFO

# Email Ingestion Configuration
mail.imap.host=${GMAIL_IMAP_HOST:imap.gmail.com}
mail.imap.port=${GMAIL_IMAP_PORT:993}
mail.username=${GMAIL_USER:}
mail.password=${GMAIL_APP_PASSWORD:}
mail.sync.batch-size=${GMAIL_SYNC_BATCH_SIZE:20}
mail.sync.enabled=${GMAIL_SYNC_ENABLED:true}
mail.sync.fixed-delay-ms=${GMAIL_SYNC_FIXED_DELAY_MS:60000}


# Google OAuth2 & Gmail API Configuration
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
google.oauth.frontend-success-url=${FRONTEND_SUCCESS_URL:http://localhost:5173?auth=google_connected}
google.oauth.frontend-error-url=${FRONTEND_ERROR_URL:http://localhost:5173?auth=google_error}

# JWT Authentication
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}