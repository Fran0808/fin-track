spring.datasource.url=${DATABASE_JDBC_URL:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.com.store.api=INFO
logging.level.org.springframework.web=WARN
server.servlet.session.cookie.secure=true
server.error.include-message=never
server.error.include-stacktrace=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.server.public-url=${APP_SERVER_PUBLIC_URL:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:}
google.oauth.frontend-success-url=${FRONTEND_SUCCESS_URL:}
google.oauth.frontend-error-url=${FRONTEND_ERROR_URL:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
